    <text x="834" y="214" fill="#1b1530" font-size="38" font-weight="800">RM 8,920</text>
  </g>
  <!-- Chart -->
  <rect x="270" y="274" width="560" height="440" rx="16" fill="#fff" stroke="#e3dfee" stroke-width="2"/>
  <text x="294" y="314" fill="#1b1530" font-size="19" font-weight="700">Weekly sales</text>
  <g fill="#a48bff">
    <rect x="310" y="520" width="44" height="150" rx="8"/>
    <rect x="382" y="460" width="44" height="210" rx="8"/>
    <rect x="454" y="500" width="44" height="170" rx="8"/>
    <rect x="526" y="400" width="44" height="270" rx="8" fill="#ff6a5c"/>
    <rect x="598" y="470" width="44" height="200" rx="8"/>
    <rect x="670" y="430" width="44" height="240" rx="8"/>
    <rect x="742" y="540" width="44" height="130" rx="8"/>
  </g>
