    <text x="332" y="694">Mon</text><text x="404" y="694">Tue</text><text x="476" y="694">Wed</text><text x="548" y="694">Thu</text><text x="620" y="694">Fri</text><text x="692" y="694">Sat</text><text x="764" y="694">Sun</text>
  </g>
  <!-- Low stock list -->
  <rect x="850" y="274" width="310" height="440" rx="16" fill="#fff" stroke="#e3dfee" stroke-width="2"/>
  <text x="874" y="314" fill="#1b1530" font-size="19" font-weight="700">Restock soon</text>
  <g font-size="15">
    <rect x="874" y="340" width="40" height="40" rx="10" fill="#ffe1dd"/><text x="928" y="358" fill="#1b1530" font-weight="600">Kopi Beans 1kg</text><text x="928" y="377" fill="#9b94b0" font-size="13">3 left</text>
    <rect x="874" y="406" width="40" height="40" rx="10" fill="#efe9ff"/><text x="928" y="424" fill="#1b1530" font-weight="600">Paper Cups (M)</text><text x="928" y="443" fill="#9b94b0" font-size="13">8 left</text>
    <rect x="874" y="472" width="40" height="40" rx="10" fill="#fff3d1"/><text x="928" y="490" fill="#1b1530" font-weight="600">Condensed Milk</text><text x="928" y="509" fill="#9b94b0" font-size="13">5 left</text>
    <rect x="874" y="538" width="40" height="40" rx="10" fill="#dcf9ec"/><text x="928" y="556" fill="#1b1530" font-weight="600">Gula Melaka</text><text x="928" y="575" fill="#9b94b0" font-size="13">6 left</text>
  </g>
  <rect x="874" y="632" width="262" height="52" rx="26" fill="#1b1530"/>
  <text x="1005" y="664" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Create purchase order</text>
